name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate Project & Auto-Fix Gradle Config
        id: locate
        run: |
          # app/build.gradle.kts বা app/build.gradle কোথায় আছে তা স্বয়ংক্রিয়ভাবে খুঁজে বের করা
          APP_GRADLE=$(find . -maxdepth 4 -path "*/app/build.gradle*" | head -n 1)
          PROJECT_DIR=$(dirname $(dirname "$APP_GRADLE"))
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found Android project at: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          # যদি settings.gradle.kts না থাকে বা pluginManagement মিসিং থাকে, তবে ঠিক করে দেওয়া
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BSP-SMS-Android"
          include(":app")
          EOF
          fi

          # রুট build.gradle.kts না থাকলে তৈরি করে AGP ও Kotlin ভার্সন সেট করা
          if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
            cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          fi

      - name: Generate Gradle 8.9 Wrapper & Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
