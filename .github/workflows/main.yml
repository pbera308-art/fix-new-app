name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Locate Project & Auto-Fix Gradle & Missing Resources
        id: locate
        run: |
          APP_GRADLE=$(find . -maxdepth 4 -path "*/app/build.gradle*" | head -n 1)
          PROJECT_DIR=$(dirname $(dirname "$APP_GRADLE"))
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found Android project at: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          # রুট settings.gradle.kts সেট করা
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BSP-SMS-Android"
          include(":app")
          EOF

          # রুট build.gradle.kts সেট করা
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          # gradle.properties না থাকলে তৈরি করা
          if [ ! -f "gradle.properties" ]; then
            cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          fi

          # মিসিং Android Resources তৈরি করা
          RES_DIR="app/src/main/res"
          mkdir -p "$RES_DIR/values" "$RES_DIR/mipmap-anydpi-v26" "$RES_DIR/drawable"

          # ১. লঞ্চার আইকন ব্যাকগ্রাউন্ড ও ফোরগ্রাউন্ড ভেক্টর তৈরি
          if [ ! -f "$RES_DIR/drawable/ic_launcher_background.xml" ]; then
            cat << 'EOF' > "$RES_DIR/drawable/ic_launcher_background.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#1976D2"/>
          </shape>
          EOF
          fi

          if [ ! -f "$RES_DIR/drawable/ic_launcher_foreground.xml" ]; then
            cat << 'EOF' > "$RES_DIR/drawable/ic_launcher_foreground.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M36,36h36v36h-36z"/>
          </vector>
          EOF
          fi

          # ২. ic_launcher এবং ic_launcher_round তৈরি
          if [ ! -f "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml" ]; then
            cat << 'EOF' > "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
            cp "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml" "$RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml"
          fi

          # ৩. strings.xml (app_name) না থাকলে তৈরি করা
          if ! grep -rq "name=\"app_name\"" "$RES_DIR/values" 2>/dev/null; then
            cat << 'EOF' > "$RES_DIR/values/strings_auto.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">BSP SMS</string>
          </resources>
          EOF
          fi

          # ৪. themes.xml (Theme.BSPSMS) না থাকলে তৈরি করা
          if ! grep -rq "name=\"Theme.BSPSMS\"" "$RES_DIR/values" 2>/dev/null; then
            cat << 'EOF' > "$RES_DIR/values/themes_auto.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.BSPSMS" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF
          fi

      - name: Generate Gradle 8.9 Wrapper & Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
